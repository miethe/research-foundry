$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://research-foundry.dev/schemas/canonical_claim.schema.yaml/v1"
title: Canonical Claim
description: >-
  Optional mutable grouping concept. It references immutable source assertions
  by ID and version and never mutates their evidence or lifecycle.
type: object
additionalProperties: false
properties:
  schema_version:
    const: "1.0"
  type:
    const: canonical_claim
  canonical_claim_id:
    type: string
  canonical_claim_version:
    type: integer
    minimum: 1
  state:
    enum: [proposed, reviewed, active, split, superseded, rolled_back]
  statement:
    type: string
    minLength: 1
  version_digest:
    description: >-
      RPC-1.4 additive field (research-provenance-continuity P1, SOL-12/18,
      round 2; WIDENED round 3, SOL-25/26/RC-2). OPTIONAL, additive,
      service-internal integrity value -- NOT part of `canonical_claim_id`'s
      own identity (which stays stable across versions, freeze doc §15.2).
      `sha256-canonical-json-v1` over `{statement, source_assertion_refs,
      inference_refs, state, canonical_claim_version, replaces,
      replacement_claims, reversal}` AT THE CURRENT `canonical_claim_version`
      (freeze doc §15.2 item 3's per-version digest, now persisted as a real
      field rather than left unstored). Round 3 (RC-2) ADDS
      `canonical_claim_version`/`replaces`/`replacement_claims`/`reversal`
      to the round-2 formula -- SOL-26's accepted attack: the round-2
      formula omitted the version integer and the reversal/replacement
      fields entirely, so `canonical_claim_version` could change (e.g.
      `1 -> 999`) or `replaces`/`replacement_claims`/`reversal.resulting_claims`
      could be substituted with NO digest change. A P4 writer under this
      contract MUST populate it on every record it writes; a reader/replay
      path MUST validate it when present (recompute over the same eight
      fields and compare); legacy absence (a record written before this
      field existed) is tolerated read-only, never required retroactively.
      The generation-manifest entry recorded at promotion time (freeze doc
      §17.7a, RC-2) is the tamper-evidence ROOT this digest is checked
      against on read/replay -- not merely the record's own stored field.
      See freeze doc §15.2/§17.7a for the exact formula, the worked test
      vector, and the P7 verifying task.
    type:
      - string
      - "null"
    pattern: "^[a-f0-9]{64}$"
  source_assertion_refs:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [assertion_id, assertion_version, relation]
      properties:
        assertion_id:
          type: string
          pattern: "^ast_[a-f0-9]{64}$"
        assertion_version:
          type: integer
          minimum: 1
        relation:
          enum: [supports, contradicts, context]
  inference_refs:
    type: array
    description: >-
      RPC-1.4 additive field (research-provenance-continuity P1, F3).
      Optional, supplementary support refs to exact inference_record
      versions. RPC-4.3's canonical-claim materializer must be able to
      publish a canonical claim from "exact assertion/inference support
      refs" together, but the shipped v1 schema only had
      `source_assertion_refs` (a provable, concrete gap). This field is
      purely additive: it is OPTIONAL and has no `minItems`, so a legacy or
      assertion-only canonical claim that never populates it remains fully
      valid with the field absent. `source_assertion_refs` below stays
      `minItems: 1` and REQUIRED, unchanged -- every canonical claim must
      still ground in at least one exact, immutable source_assertion;
      `inference_refs` can only ever ADD supplementary reasoning-based
      support, never substitute for direct assertion grounding. If a future
      phase proves a concrete need for an inference-only canonical claim
      (zero source_assertion_refs), that is a separate, separately-justified
      amendment -- not something this freeze pre-authorizes.
    items:
      type: object
      additionalProperties: false
      required: [inference_id, inference_version, relation]
      properties:
        inference_id:
          type: string
        inference_version:
          type: integer
          minimum: 1
        relation:
          enum: [supports, contradicts, context]
  replaces:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [canonical_claim_id, canonical_claim_version]
      properties:
        canonical_claim_id:
          type: string
        canonical_claim_version:
          type: integer
          minimum: 1
  replacement_claims:
    type: array
    minItems: 1
    description: Versioned canonical claims that replace this split or rolled-back claim.
    items:
      type: object
      additionalProperties: false
      required: [canonical_claim_id, canonical_claim_version]
      properties:
        canonical_claim_id:
          type: string
        canonical_claim_version:
          type: integer
          minimum: 1
  reversal:
    type: object
    additionalProperties: false
    required: [event_id, reason, provenance, resulting_claims]
    properties:
      event_id:
        type: string
      reason:
        type: string
      provenance:
        type: object
        additionalProperties: false
        required: [recorded_by, recorded_at]
        properties:
          recorded_by:
            type: string
          recorded_at:
            type: string
            format: date-time
      resulting_claims:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [canonical_claim_id, canonical_claim_version]
          properties:
            canonical_claim_id:
              type: string
            canonical_claim_version:
              type: integer
              minimum: 1
required:
  - schema_version
  - type
  - canonical_claim_id
  - canonical_claim_version
  - state
  - statement
  - source_assertion_refs
allOf:
  - if:
      properties:
        state:
          enum: [split, rolled_back]
      required: [state]
    then:
      required: [reversal, replacement_claims]
