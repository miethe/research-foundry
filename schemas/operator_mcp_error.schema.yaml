$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://research-foundry.dev/schemas/operator_mcp_error.schema.yaml/v1"
title: Operator MCP Error
description: >-
  Bounded, redacted error envelope for the local-stdio Operator MCP
  (research-foundry-operator-mcp-v1 P1, OPM-1.4); see PRD section 6.4
  ("Bounded error envelope") and decisions-block section 0 ("Error envelopes
  are bounded and redacted").

  CLOSED REASON-CODE ENUM (AC OPM-7, fixed check-order OPM-1.3): every
  member below corresponds to exactly one stage of
  `operator_mcp_policy.authorize_operation`'s fixed order --
  capability (`operation_unknown`, `tool_unknown`, `target_invalid`) ->
  RBAC (`identity_denied`, `rbac_denied`) -> audit-health
  (`audit_unhealthy`) -> guard (`guard_blocked`, `guard_review_required`) ->
  preflight (`preflight_failed`) -> confirmation binding
  (`confirmation_missing`, `confirmation_expired`, `confirmation_replayed`,
  `confirmation_mismatch`, `idempotency_conflict`) -- plus `not_found`
  (reserved for P2+ object-lookup no-existence-leak denials) and
  `payload_too_large`/`internal_error` as generic bounded fallbacks. No new
  member is added without a schema version bump.

  TWO DISTINCT NO-EXISTENCE-LEAK SHAPES, NEVER CONFLATED (AC OPM-1/OPM-2,
  security-review round 1 finding H6): `identity_denied` is reserved
  STRICTLY for a wholly missing/unresolved identity -- the pre-lookup case
  where there is no trusted actor at all. Every denial reachable AFTER a
  target reference has been looked up -- a target whose resolved owning
  workspace differs from the identity's own workspace, a target above the
  caller's `sensitivity_ceiling`, or a target that is genuinely absent --
  resolves to the SAME `not_found` reason code, the SAME
  `_SAFE_MESSAGES["not_found"]` text, and `retryable: false`, with no
  distinguishing message, object id, count, or filesystem detail. An
  attacker MUST NOT be able to distinguish "exists, not yours" / "above
  your clearance" / "does not exist" from one another. See
  `operator_mcp_policy.py`'s `_SAFE_MESSAGES` table, which is the ONLY
  source of `message` text for every reason code (never an f-string
  embedding caller-supplied or exception content).

  NO RAW EXCEPTION SHAPE (AC OPM-7, bounded/redacted): `message` and
  `detail` are both length-capped AND pattern-forbidden from resembling a
  Python traceback/stack frame (`Traceback`, `site-packages`, or a
  `File "...", line N` frame) OR an absolute filesystem path (BLOCK-1,
  round 4 gate: `str(exc)` for a filesystem-related failure, e.g.
  `OSError`/`PermissionError`, embeds a bare path with no traceback framing
  at all -- the traceback-only pattern never caught it) -- a defense-in-depth
  schema-level check layered on top of `operator_mcp_policy.py`'s own
  safe-message table and `_redact_and_bound`'s wholesale-replacement
  redaction, neither of which interpolates an exception's `str()` verbatim
  into either field.

  NO UNAUTHORIZED FIELD (AC OPM-7): `additionalProperties: false` at the
  root; there is no stack trace, environment variable, secret, credential,
  provider raw output, or unrestricted filesystem-path field anywhere in
  this schema.
type: object
additionalProperties: false
properties:
  schema_version:
    const: "1.0"
  type:
    const: operator_mcp_error
  reason_code:
    enum:
      - identity_denied
      - rbac_denied
      - audit_unhealthy
      - guard_blocked
      - guard_review_required
      - preflight_failed
      - operation_unknown
      - tool_unknown
      - target_invalid
      - confirmation_missing
      - confirmation_expired
      - confirmation_replayed
      - confirmation_mismatch
      - idempotency_conflict
      - not_found
      - payload_too_large
      - internal_error
  message:
    description: >-
      Safe, human-readable, drawn ONLY from
      `operator_mcp_policy._SAFE_MESSAGES[reason_code]` -- never an
      f-string embedding caller input or an exception's own text.
    type: string
    minLength: 1
    maxLength: 300
    not:
      pattern: "(?i)traceback|site-packages|File \"[^\"]*\", line \\d+|/Users/|/home/|/var/|/etc/|/opt/|/tmp/|/root/"
  retryable:
    type: boolean
  operation_id:
    type: [string, "null"]
    pattern: "^opm_[a-f0-9]{64}$"
  receipt_ref:
    description: Opaque terminal-receipt reference, when one already exists (exact replay).
    type: [string, "null"]
    minLength: 1
    maxLength: 128
  detail:
    description: >-
      Optional bounded, redacted supplementary detail (e.g. which field
      failed schema validation) -- never a stack trace, secret, or
      unrestricted path.
    type: string
    maxLength: 500
    not:
      pattern: "(?i)traceback|site-packages|File \"[^\"]*\", line \\d+|/Users/|/home/|/var/|/etc/|/opt/|/tmp/|/root/"
  occurred_at:
    type: string
    format: date-time
required:
  - schema_version
  - type
  - reason_code
  - message
  - retryable
  - operation_id
  - receipt_ref
  - occurred_at
