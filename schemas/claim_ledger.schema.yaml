$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://research-foundry.dev/schemas/claim_ledger.schema.yaml"
title: Claim Ledger
description: A ledger of claims with status, materiality, sources, and verification state.
type: object
properties:
  id:
    type: string
  intent_id:
    type: string
  report_ref:
    type: string
  verification_status:
    enum:
      - pending
      - passed
      - failed
  claims:
    type: array
    items:
      type: object
      properties:
        claim_id:
          type: string
        text:
          type: string
        materiality:
          enum:
            - material
            - background
            - style
        claim_type:
          enum:
            - factual
            - causal
            - comparative
            - quantitative
            - attribution
            - recommendation
            - prediction
        status:
          enum:
            - supported
            - mixed
            - contradicted
            - inference
            - speculation
            - unsupported
        confidence:
          enum:
            - low
            - medium
            - high
        sources:
          type: array
          items:
            type: object
            properties:
              source_card_id:
                type: string
              evidence_id:
                type: string
              relation:
                enum:
                  - supports
                  - contradicts
                  - context
              locator:
                type: string
            additionalProperties: true
        inference_basis:
          type: object
          properties:
            from_claims:
              type: array
              items:
                type: string
            reasoning_summary:
              type:
                - string
                - "null"
          additionalProperties: true
        persistent_references:
          type: [object, "null"]
          description: >-
            Optional durable-ledger links. Legacy run-local claims omit this
            block and require no synthetic persistent IDs.
          additionalProperties: false
          properties:
            source_edition_id:
              type: [string, "null"]
            passage_id:
              type: [string, "null"]
            source_assertion_id:
              type: [string, "null"]
            assertion_version:
              type: [integer, "null"]
              minimum: 1
            canonical_claim_id:
              type: [string, "null"]
            canonical_claim_version:
              type: [integer, "null"]
              minimum: 1
            inference_id:
              type: [string, "null"]
            inference_version:
              type: [integer, "null"]
              minimum: 1
              description: >-
                RPC SOL-11 additive amendment (F17, research-provenance-continuity
                P1). Optional companion to inference_id, mirroring the
                existing canonical_claim_id+canonical_claim_version pair.

                SOL-17 (round 2, REVERTED the round-1 schema conditional):
                round 1 added a schema-level `allOf` requiring
                inference_version whenever inference_id was non-null. That
                conditional REJECTED a baseline-valid legacy instance
                (`{persistent_references: {inference_id: "legacy-inf"}}` with
                no version field at all) -- exactly the pre-existing,
                version-absent reference shape this repo's own read paths
                must keep tolerating (RPC-DF-1/AC RPC-3's "legacy_unresolved"
                resilience framing applies here too). A shipped-schema
                amendment MUST stay additive against every baseline-valid
                instance, not merely against instances this document itself
                invented -- the round-1 conditional broke that. No schema
                conditional remains here as of round 2: `inference_version`
                is a plain optional integer, exactly like
                `canonical_claim_version`'s own field before any pairing
                rule existed.

                The atomic-pair rule (inference_id + inference_version
                written together or not at all) is now a WRITER-LEVEL MUST
                instead of a schema-level conditional -- enforced by P4's
                `persistent_references` write path (freeze doc §17.1 item 4)
                and verified by the P7 gate task RPC-7.16 (freeze doc
                §17.9), never by this schema. Read semantics for a row
                carrying inference_id with no inference_version (whether a
                genuinely pre-P4 legacy row, or a row a non-conforming
                writer produced): a reader MUST treat the reference as
                AMBIGUOUS-VERSION, never resolve it to "the latest"
                inference_version implicitly, and MUST report it using the
                same `legacy_unresolved`-class typed skip AC RPC-3 already
                names for a missing/absent persistent reference (freeze doc
                §13.6 example (e)) -- an inference_id without a version is
                not usable as an exact persistent reference, but it is not a
                validation failure either.
        report_locations:
          type: array
          items:
            type: object
            properties:
              file:
                type: string
              heading:
                type: string
              paragraph_id:
                type: string
            additionalProperties: true
        reviewer_notes:
          type: string
        _term_index:
          type: object
          description: >-
            Additive, non-authoritative, write-time term/usage-role index
            computed by claim-map (docs/project_plans/design-specs/claim-term-indexing.md).
            Never participates in verification, identity hashing, or rights
            governance, and never added outside this namespaced key (no bare
            `usage_role`). Absent when the claim has zero vocabulary hits or
            no vocabulary file was loaded.
          additionalProperties: true
          properties:
            terms:
              type: array
              items:
                type: string
            usage_roles:
              type: object
              additionalProperties:
                type: string
            vocabulary_version:
              type: [string, "null"]
      additionalProperties: true
  unresolved_questions:
    type: array
    items:
      type: object
      properties:
        question:
          type: string
        why_unresolved:
          type: string
        recommended_next_source:
          type:
            - string
            - "null"
      additionalProperties: true
required:
  - id
  - intent_id
additionalProperties: true
