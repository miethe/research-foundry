$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://research-foundry.dev/schemas/report_frontmatter.schema.yaml"
title: Report Front Matter
description: Front-matter schema for a research report Markdown document.
type: object
properties:
  schema_version:
    type: string
  type:
    const: research_report
  report_id:
    type: string
  title:
    type: string
  intent_id:
    type: string
  evidence_bundle_id:
    type: string
  created_at:
    type: string
  status:
    enum:
      - draft
      - verified
      - published
      - archived
  audience:
    enum:
      - self
      - technical
      - executive
      - public
      - client
  sensitivity:
    enum:
      - public
      - personal
      - work_sensitive
      - client_sensitive
  claim_policy:
    type: string
  verification_status:
    enum:
      - pending
      - passed
      - failed
  _term_index:
    type: object
    description: >-
      Additive, non-authoritative rollup of terms/usage-roles across this
      report's claims (union), computed at the same write time as
      claim-map's own attach (docs/project_plans/design-specs/claim-term-indexing.md,
      OQ-E). Never participates in verification or governance. Absent when
      no claim in this report carries a `_term_index`.
    additionalProperties: true
    properties:
      terms:
        type: array
        items:
          type: string
      usage_roles:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
      vocabulary_version:
        type: [string, "null"]
required:
  - report_id
  - type
  - title
additionalProperties: true
