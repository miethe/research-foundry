[project]
name = "research-foundry"
version = "0.1.0"
description = "Markdown/YAML-first research control plane: turn raw ideas into governed research swarms, evidence bundles, and verifiable reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nick Miethe", email = "miethe.dev@gmail.com" }]
keywords = ["research", "agentic-os", "evidence-bundles", "claim-verification", "ccdash", "meatywiki", "skillbom"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "markdown-it-py>=3.0",
    "pyjwt[crypto]>=2.8",
    "cryptography>=43.0",
]

[project.optional-dependencies]
# External research tools are OPTIONAL. Adapters import them lazily and degrade
# to deterministic/offline behavior when they are not installed.
research = [
    "gpt-researcher>=0.8",
    "paper-qa>=5.0",
]
llm = [
    "claude-agent-sdk>=0.1",
    "litellm>=1.40",
]
search = ["httpx>=0.27"]
# Both `rf-mcp`/`rf-knowledge-mcp`/`rf-operator-mcp` target the 1.x
# `mcp.server.fastmcp.FastMCP` API. SDK 2.0 renamed the high-level server
# class to `mcp.server.mcpserver.MCPServer` (a breaking change, not merely
# an addition) -- pinned below `2` until a dedicated migration lands
# (filed follow-up: research-foundry-operator-mcp-v1 M2 Leg B AAR).
mcp = ["mcp>=1.0,<2"]
# PDF text extraction is OPTIONAL. The extractor imports pypdf lazily and
# degrades to locator-only behavior when it is not installed.
pdf = ["pypdf>=3.0.0"]
serve = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    # Required by fastapi/starlette TestClient (tests/test_serve_*.py); not a runtime dep.
    "httpx>=0.27",
]
docs = [
    "mkdocs-material",
    "pymdown-extensions",
]

[project.scripts]
rf = "research_foundry.cli:app"
# Search-router MCP server (stdio). Optional: requires the `mcp` extra
# (`pip install 'research-foundry[mcp]'` / `uv tool install --with mcp .`).
# Without it the entrypoint raises a clear RuntimeError pointing to the extra.
# Exposed over ssh-stdio by the launchpad's aos-mcp (AOS remote targeting).
# Points at mcp_launcher (DI-1 F2 remediation) -- the sole blessed launcher,
# which resolves the launch principal and enforces the stdio-only transport
# guard before delegating to mcp_server.build_server(). mcp_server.main()
# still works too (delegates here) for .mcp.json's direct `python -m` launch.
rf-mcp = "research_foundry.services.search_router.mcp_launcher:main"
# Knowledge MCP server (stdio). Optional: requires the same `mcp` extra as
# `rf-mcp` above. Without it the entrypoint raises a clear RuntimeError
# pointing to the extra. An INDEPENDENT process/registry/settings boundary
# from `rf-mcp` -- never imports from research_foundry.services.search_router.*
# or an Operator/Hermes-adjacent module (KMCP-4.1, decisions-block §9.1).
# Exposes exactly the governed, read-only research_foundry.services.
# knowledge_access service over the frozen core `search(query)`/`fetch(id)`
# contract (KMCP-1.2); registers no acquisition/writeback/provider tool.
rf-knowledge-mcp = "research_foundry.knowledge_mcp.process:main"
# Operator MCP server (stdio). Optional: requires the same `mcp` extra as
# `rf-mcp`/`rf-knowledge-mcp` above. Without it the entrypoint raises a clear
# RuntimeError pointing to the extra. An INDEPENDENT process/registry
# boundary from both `rf-mcp` and `rf-knowledge-mcp` -- never imports from
# research_foundry.knowledge_mcp.* or research_foundry.services.search_router.*
# (research-foundry-operator-mcp-v1 M2, OPM-5.1/5.2/5.4). Exposes the exact,
# closed 14-tool inventory (13 operation kinds + `operation.preflight`) over
# the P1-P3 authorize -> consume -> execute pipeline; registers no live
# writeback path.
rf-operator-mcp = "research_foundry.operator_mcp.process:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: end-to-end pipeline tests that drive multiple services",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer's idiom places Option/Argument descriptors in parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
